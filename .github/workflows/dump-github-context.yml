name: Dump github context

on:
  workflow_dispatch:

permissions: {}
jobs:
  dump_github_context:
    runs-on: ubuntu-latest
    steps:
      - name: Dump non-sensitive workflow metadata
        run: |
          printf 'repository=%s\nref=%s\nworkflow=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_WORKFLOW"
        shell: bash
