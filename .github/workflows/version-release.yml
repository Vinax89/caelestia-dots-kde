name: Version Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

jobs:
  version-release:
    runs-on: ubuntu-latest
    # `workflow_run` runs in the context of the base repository with whatever
    # permissions this job declares -- here, contents: write. The `branches:`
    # filter above is NOT a provenance check: it matches
    # workflow_run.head_branch, which for a pull_request run is the *head*
    # branch, so a fork PR opened from a branch literally named "main" passes
    # it. Everything below would then run against attacker-controlled code
    # holding a write-scoped token.
    #
    # Require the triggering run to be a push on this repository. Fork PRs
    # produce event == 'pull_request' and a head_repository that is the fork,
    # so both halves have to hold.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: version-release
      cancel-in-progress: true
    permissions:
      contents: write
    env:
      GIT_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Verify the signature BEFORE any of the commit's files reach the disk.
      # This fetches the commit object into a bare repository: no working tree
      # is written, no submodule URL is resolved, and nothing from the commit
      # is read, sourced or executed until it has been anchored to the pinned
      # fingerprint.
      - name: Verify release commit signature
        env:
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          trusted_fingerprint=968479A1AFF927E37D1A566BB5690EEEBB952194

          workdir="$(mktemp -d)"
          trap 'rm -rf -- "$workdir"' EXIT
          verify_home="$workdir/gnupg"
          mkdir -p "$verify_home"
          chmod 700 "$verify_home"

          curl -fsSL --proto '=https' --tlsv1.2 https://github.com/web-flow.gpg \
            -o "$workdir/trusted.asc"
          fingerprints="$(gpg --homedir "$verify_home" --batch --with-colons \
            --import-options show-only --import "$workdir/trusted.asc" 2>/dev/null \
            | awk -F: '$1 == "fpr" { print $10 }')"
          grep -Fxq "$trusted_fingerprint" <<< "$fingerprints"
          gpg --homedir "$verify_home" --batch --import "$workdir/trusted.asc" >/dev/null 2>&1

          git init --quiet --bare "$workdir/bare.git"
          git -C "$workdir/bare.git" remote add origin "https://github.com/$TARGET_REPO.git"
          git -C "$workdir/bare.git" fetch --quiet --depth=1 origin "$GIT_COMMIT"

          status="$(GNUPGHOME="$verify_home" git -C "$workdir/bare.git" \
            -c gpg.program=gpg verify-commit --raw "$GIT_COMMIT" 2>&1 || true)"
          valid_fingerprint="$(printf '%s\n' "$status" \
            | sed -n 's/^\[GNUPG:\] VALIDSIG \([0-9A-F]*\) .*/\1/p' | head -n1)"

          if [[ "$valid_fingerprint" != "$trusted_fingerprint" ]]; then
            echo "::error::$GIT_COMMIT is not signed by the trusted release signer."
            echo "  expected: $trusted_fingerprint"
            echo "  got:      ${valid_fingerprint:-<no valid signature>}"
            exit 1
          fi

          echo "Verified signature on $GIT_COMMIT"

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Fetch main Branch
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

      - name: Load Version from Config
        run: |
          set -euo pipefail

          # Parse, do not `source`. version.env is data; sourcing it executes it,
          # which turns any write to that file into arbitrary shell in a job
          # holding a write-scoped token.
          VERSION="$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*//p' \
            .github/version.env | tr -d '"'"'"' \t\r' | head -n1)"

          if [[ -z "${VERSION:-}" ]]; then
            echo "VERSION is missing in .github/version.env"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must match vX.Y.Z, got: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate Version Sync (Release-Only)
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016  # the ${...} below is QML source matched literally
          ABOUT_BINDING=$(grep -F 'text: CUtils.version ? `v${CUtils.version}` : "…"' shell/modules/nexus/pages/AboutPage.qml | head -n 1 || true)

          echo "Config VERSION: $VERSION"
          echo "About binding:  ${ABOUT_BINDING:-<missing>}"

          if [[ -z "${ABOUT_BINDING:-}" ]]; then
            echo "Version validation failed. Ensure AboutPage reads CUtils.version before release."
            exit 1
          fi

      - name: Create or Update Version Tag
        run: |
          set -euo pipefail

          # $GIT_COMMIT was anchored to the pinned release-signer fingerprint by
          # the "Verify release commit signature" step, before this commit's
          # files were ever written to disk.

          PREVIOUS_VERSION_TAG=$(git rev-parse -q --verify "refs/tags/$VERSION" || true)

          echo "PREVIOUS_VERSION_TAG=$PREVIOUS_VERSION_TAG" >> "$GITHUB_ENV"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; leaving it unchanged."
            echo "RELEASE_CREATED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # Lightweight tags deliberately inherit the verified commit signature.
          # The updater resolves the tag, then verifies that commit against the
          # pinned signer fingerprint before executing any checked-out code.
          git tag "$VERSION" "$GIT_COMMIT"
          git push origin "refs/tags/$VERSION"
          echo "RELEASE_CREATED=true" >> "$GITHUB_ENV"

      - name: Create or Update Release
        if: ${{ env.RELEASE_CREATED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS_VERSION_TAG" ]; then
            git log "$PREVIOUS_VERSION_TAG..$GIT_COMMIT" --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
          else
            git log origin/main -n 15 --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
          fi

          {
            echo "### What's New in $VERSION"
            echo

            if [ -s commit_notes.txt ]; then
              cat commit_notes.txt
            else
              echo "- Maintenance release for $VERSION."
            fi

            echo
            echo "*May your desktop always reflect the stars.*"
          } > release_notes.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Caelestia KDE $VERSION" \
              --notes-file release_notes.md \
              --prerelease=false \
              --latest
          else
            gh release create "$VERSION" \
              --title "Caelestia KDE $VERSION" \
              --notes-file release_notes.md \
              --prerelease=false \
              --latest
          fi

      - name: Update README Contributor Stats
        if: ${{ env.RELEASE_CREATED == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          python3 .github/scripts/contributors.py --update-readme

          if git diff --quiet -- .github/README.md; then
            echo "No contributor changes to commit."
            exit 0
          fi

          # Commit through the Contents API rather than `git commit && git push`.
          #
          # A local commit made by the runner is unsigned. The updater trusts
          # commits signed by GitHub's web-flow key, so pushing an unsigned
          # commit to the branch tip breaks verification for anyone who
          # verifies the branch head. Commits created through the API are
          # web-flow signed, which keeps the chain intact.
          branch="${TARGET_BRANCH:-main}"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/README.md?ref=${branch}" --jq .sha)"

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.github/README.md" \
            -f message="[skip ci] Update contributor stats for $VERSION" \
            -f content="$(base64 -w0 .github/README.md)" \
            -f sha="$current_sha" \
            -f branch="$branch" >/dev/null

          echo "Committed contributor stats to $branch via the API (web-flow signed)."
