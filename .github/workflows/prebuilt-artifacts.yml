name: Prebuilt Artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

# Both jobs upload to this fixed release tag, which is what setup.sh and
# installDP.sh hardcode as their download location:
#   https://github.com/<repo>/releases/download/caelestia-bin-repo/...
env:
  REPO_TAG: caelestia-bin-repo

jobs:
  # ═══════════════════════════════════════════════════════════
  # Prebuilt installer TUI binaries (x86_64 + aarch64) so setup.sh can
  # download instead of compiling the TUI on the user's machine.
  # ═══════════════════════════════════════════════════════════
  installer-bin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make

      - name: Build installer TUI
        run: |
          cmake -B installer/build -DCMAKE_BUILD_TYPE=Release installer
          cmake --build installer/build -- -j"$(nproc)"

      - name: Upload prebuilt installer
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cp installer/build/caelestia-install "caelestia-install-$ARCH"
          gh release create "$REPO_TAG" --latest=false --prerelease \
            --title "Prebuilt artifacts" \
            --notes "Prebuilt installer binaries and the binary package repo consumed by setup.sh and installDP.sh." >/dev/null 2>&1 || true
          gh release upload "$REPO_TAG" "caelestia-install-$ARCH" --clobber

  # ═══════════════════════════════════════════════════════════
  # Publish SHA256SUMS for the installer binaries, signed when a release key is
  # configured. setup.sh refuses a prebuilt binary that does not match a signed
  # entry here and compiles from source instead -- an unsigned checksum file
  # sitting in the same release as the binary it describes proves nothing,
  # because anything able to replace one can replace the other.
  # ═══════════════════════════════════════════════════════════
  installer-checksums:
    needs: installer-bin
    runs-on: ubuntu-latest
    env:
      # `secrets` is not an available context in a step-level `if:`, but it is
      # in job-level `env:`, so the presence check is resolved once here.
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
    steps:
      - name: Download published binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          for arch in x86_64 aarch64; do
            gh release download "$REPO_TAG" --pattern "caelestia-install-$arch" --clobber
          done
          ls -l

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum caelestia-install-* > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${RELEASE_SIGNING_PASSPHRASE:-}" \
            --detach-sign --armor --output dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf -- "$GNUPGHOME"

      - name: Upload checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          assets=(SHA256SUMS)
          [[ -f SHA256SUMS.asc ]] && assets+=(SHA256SUMS.asc)
          gh release upload "$REPO_TAG" "${assets[@]}" --clobber
          if [[ ! -f SHA256SUMS.asc ]]; then
            echo "::warning::SHA256SUMS is unsigned (no RELEASE_SIGNING_KEY secret)." \
                 "setup.sh will decline the prebuilt binary and compile from source."
          fi

  # ═══════════════════════════════════════════════════════════
  # Binary pacman repo with the last source-built AUR packages (libcava,
  # darkly) so the installer can pull them prebuilt from pacman instead of
  # compiling them with makepkg on the user's machine.
  # ═══════════════════════════════════════════════════════════
  pacman-repo:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build prerequisites
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Build AUR packages
        run: |
          install -d -o builder -g builder /tmp/pkgs
          cat > /tmp/build-aur.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          for pkg in libcava darkly; do
              rm -rf "/tmp/$pkg"
              git clone --depth 1 "https://aur.archlinux.org/$pkg.git" "/tmp/$pkg"
              cd "/tmp/$pkg"
              PKGDEST=/tmp/pkgs makepkg -s --noconfirm
          done
          EOF
          chmod +x /tmp/build-aur.sh
          su builder -c /tmp/build-aur.sh

      - name: Build repo database
        run: |
          cd /tmp/pkgs
          repo-add caelestia-bin.db.tar.gz ./*.pkg.tar.zst
          mv caelestia-bin.db.tar.gz caelestia-bin.db
          mv caelestia-bin.files.tar.gz caelestia-bin.files

      - name: Upload repo to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/pkgs
          gh release create "$REPO_TAG" --latest=false --prerelease \
            --title "Prebuilt artifacts" \
            --notes "Prebuilt installer binaries and the binary package repo consumed by setup.sh and installDP.sh." >/dev/null 2>&1 || true
          gh release upload "$REPO_TAG" caelestia-bin.db caelestia-bin.files ./*.pkg.tar.zst --clobber
