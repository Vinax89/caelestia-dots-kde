name: Sync Version Files

on:
  workflow_dispatch:

jobs:
  sync-version-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Load Version from Config
        run: |
          set -euo pipefail
          source .github/version.env

          if [[ -z "${VERSION:-}" ]]; then
            echo "VERSION is missing in .github/version.env"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must match vX.Y.Z, got: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync Runtime Version Files
        run: |
          set -euo pipefail

          sed -i -E '0,/set\(VERSION "v[0-9]+\.[0-9]+\.[0-9]+"\)/s//set(VERSION "'"$VERSION"'")/' shell/CMakeLists.txt

      - name: Commit Synced Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- shell/CMakeLists.txt; then
            echo "No version changes detected."
            exit 0
          fi

          # Commit via the Contents API so the result is web-flow signed. A
          # locally-made runner commit is unsigned, and the updater's signature
          # check rejects unsigned commits at a branch tip.
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/shell/CMakeLists.txt?ref=${GITHUB_REF_NAME}" --jq .sha)"

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/shell/CMakeLists.txt" \
            -f message="chore: sync version files to $VERSION" \
            -f content="$(base64 -w0 shell/CMakeLists.txt)" \
            -f sha="$current_sha" \
            -f branch="${GITHUB_REF_NAME}" >/dev/null

          echo "Committed version sync to ${GITHUB_REF_NAME} via the API (web-flow signed)."
