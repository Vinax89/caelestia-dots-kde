name: Validate

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-integration:
    name: Installer integration (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:base
          - distro: fedora
            image: fedora:42
          - distro: debian
            image: debian:bookworm
    steps:
      - name: Bootstrap checkout dependency
        shell: bash
        run: |
          case "${{ matrix.distro }}" in
            arch) pacman -Sy --noconfirm git ;;
            fedora) dnf install -y git ;;
            debian) apt-get update && apt-get install -y --no-install-recommends git ca-certificates ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Exercise real install, retry, cancellation, and rollback
        shell: bash
        env:
          TEST_DISTRO: ${{ matrix.distro }}
        run: bash tests/integration/run-in-container.sh

  # ═══════════════════════════════════════════════════════════
  # Job 1: Shell script quality - syntax, shellcheck, best practices
  # ═══════════════════════════════════════════════════════════
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shell quality checks
        run: bash .github/scripts/check_shell_quality.sh

  # ═══════════════════════════════════════════════════════════
  # Job 2: QML syntax validation
  # ═══════════════════════════════════════════════════════════
  qml-lint:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Bootstrap checkout dependency
        run: pacman -Sy --noconfirm git

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install QML parser
        run: pacman -Syu --noconfirm --needed qt6-declarative diffutils

      - name: Parse shell QML files
        run: |
          echo "::group::QML validation"
          FORMATTER=$(command -v qmlformat6 || command -v qmlformat || test ! -x /usr/lib/qt6/bin/qmlformat || echo /usr/lib/qt6/bin/qmlformat)
          test -n "$FORMATTER" || { echo 'qmlformat is required'; exit 1; }
          failures=$(mktemp)
          while IFS= read -r -d '' file; do
            "$FORMATTER" --ignore-settings "$file" >/dev/null 2>&1 || echo "$file" >> "$failures"
          done < <(find shell -name '*.qml' -print0)
          sort -o "$failures" "$failures"
          if ! diff -u .github/ci-baselines/qml-parse.txt "$failures"; then
            echo 'QML parser failure set changed; inspect new failures and update the baseline only for confirmed parser limitations.'
            exit 1
          fi
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════
  # Job 3: C++ build - compile the TUI installer
  # ═══════════════════════════════════════════════════════════
  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make

      - name: Configure installer build
        run: |
          cd installer
          cmake -B build -DCMAKE_BUILD_TYPE=Release .
        env:
          CCACHE_DISABLE: 1

      - name: Build installer
        run: cmake --build installer/build -- -j$(nproc)

      - name: Verify binary exists
        run: test -f installer/build/caelestia-install && echo "Installer binary OK"

  # ═══════════════════════════════════════════════════════════
  # Job 4: Python quality - lint, compile, best practices
  # ═══════════════════════════════════════════════════════════
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check 'flake8==7.1.1'

      - name: Python compile check
        run: |
          echo "::group::Python compile check"
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/__pycache__/*' \
            -print0 | xargs -0 -n1 python3 -m py_compile
          echo "::endgroup::"

      - name: flake8 lint
        run: |
          echo "::group::flake8"
          # Only check our own Python scripts, not vendored/pre-existing ones
          # (shell/scripts holds the QML linter and other repo tooling).
          flake8 .github/scripts/ shell/scripts/ \
            --exclude 'orion_search.py,menu_perf_stats.py' \
            --max-line-length=120 \
            --extend-ignore=E402,W503,E501,E203 \
            --count \
            --show-source \
            --statistics
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════
  # Job 5: Repository integrity - cross-cutting consistency checks
  # ═══════════════════════════════════════════════════════════
  repo-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Run repository integrity tests
        run: python3 .github/scripts/test_repo_integrity.py

  # ═══════════════════════════════════════════════════════════
  # Job 6: JSON configuration validation
  # ═══════════════════════════════════════════════════════════
  json-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Validate theme.json and menu.json
        run: python3 .github/scripts/validate_json_configs.py

  # ═══════════════════════════════════════════════════════════
  # Job 7: File hygiene - large files, whitespace, merge conflicts
  # ═══════════════════════════════════════════════════════════
  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Run file hygiene checks
        # PRs: only files changed in this PR (hard). Pushes to main/dev: full
        # repo scan (report-only — there is pre-existing debt that would fail
        # a hard gate, but the log surfaces it for cleanup).
        run: python3 .github/scripts/check_file_hygiene.py ${{ github.event_name == 'push' && '--all' || '' }}

  # ═══════════════════════════════════════════════════════════
  # Job 8: Markdown lint
  # ═══════════════════════════════════════════════════════════
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          # The repository's legacy documentation has an existing markdownlint
          # backlog. Keep the actively maintained installer/update documentation
          # gated without turning that unrelated backlog into a release blocker.
          globs: |
            .github/CONTRIBUTING.md
            .github/docs/update_trust.md
            tests/integration/README.md

  # ═══════════════════════════════════════════════════════════
  # Job 9: QML conventions - project linter regression gate
  # ═══════════════════════════════════════════════════════════
  # shell/scripts/qml-lint-conventions.py has thousands of pre-existing
  # violations, so this job diffs against a stored baseline and fails only when
  # NEW violations appear. Regenerate with --update when intentional.
  qml-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Run QML convention regression check
        run: python3 .github/scripts/check_qml_conventions.py

  # ═══════════════════════════════════════════════════════════
  # Job 10: Embedded bash - syntax-check bash/sh inside QML Process commands
  # ═══════════════════════════════════════════════════════════
  # Quickshell runs `command: ["bash", "-c", `<script>`]` strings that qmllint
  # and shellcheck never see; a typo there only surfaces at runtime.
  embedded-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check bash/sh scripts embedded in QML
        run: python3 .github/scripts/check_embedded_bash.py

  # ═══════════════════════════════════════════════════════════
  # Job 11: Config cross-reference - QML config keys vs C++ declarations
  # ═══════════════════════════════════════════════════════════
  # Catches Config./GlobalConfig. references that don't exist in the plugin's
  # CONFIG_PROPERTY declarations (renamed keys, typos) - the shell logs
  # "Cannot assign to non-existent property" and the widget silently breaks.
  config-cross-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Cross-check QML config references against C++ declarations
        run: python3 .github/scripts/check_config_references.py

  # ═══════════════════════════════════════════════════════════
  # Job 12: actionlint - validate workflow files themselves
  # ═══════════════════════════════════════════════════════════
  # Catches malformed ${{ }} expressions, bad `on:` keys, wrong permission
  # scopes, etc. that a plain YAML parse cannot.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Download actionlint
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflow files
        run: actionlint -shellcheck= -color

  # ═══════════════════════════════════════════════════════════
  # Job 13: Wayland static lifetime - catch exit-time SIGSEGVs
  # ═══════════════════════════════════════════════════════════
  # A class inheriting QWaylandClientExtensionTemplate<T> or QtWayland::* owns
  # a live wl_proxy. Holding one as a function-local (or other) static by
  # value tears it down from an exit handler after Qt's closed the display,
  # which segfaults the shell on quit - see windowscreencast.cpp/plasmawindows.cpp
  # for the fix pattern (leak the pointer instead).
  wayland-static-lifetime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check for value-typed statics of Wayland proxy-wrapping types
        run: python3 .github/scripts/check_wayland_static_lifetime.py

  # ═══════════════════════════════════════════════════════════
  # Job 14: Production shell/plugin build
  # ═══════════════════════════════════════════════════════════
  shell-build:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Bootstrap checkout dependency
        run: pacman -Sy --noconfirm git

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install shell build dependencies
        run: |
          pacman -Syu --noconfirm --needed cmake gcc pkgconf ninja \
            meson fftw iniparser \
            qt6-base qt6-declarative qt6-shadertools qt6-wayland \
            kwindowsystem kguiaddons kglobalaccel kconfig kconfigwidgets \
            kcoreaddons ki18n kpackage kio kservice wayland libx11 libdrm pipewire \
            libqalculate aubio

      - name: Build pinned libcava
        run: |
          git clone --filter=blob:none https://github.com/LukashonakV/cava.git /tmp/libcava
          git -C /tmp/libcava checkout --detach f03278ef9e5e7948fb206453d2f02758f8db216c
          meson setup /tmp/libcava/build /tmp/libcava
          meson compile -C /tmp/libcava/build
          meson install -C /tmp/libcava/build

      - name: Configure production plugin
        env:
          CC: /usr/bin/gcc
          CXX: /usr/bin/g++
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: cmake -G Ninja -S shell -B shell/build -DCMAKE_BUILD_TYPE=Release -DENABLE_MODULES=plugin

      - name: Build production plugin
        run: cmake --build shell/build --parallel

  # ═══════════════════════════════════════════════════════════
  # Final gate: require all non-skippable jobs to pass
  # ═══════════════════════════════════════════════════════════
  validate-gate:
    needs:
      - shell-quality
      - qml-lint
      - cpp-build
      - python-quality
      - repo-integrity
      - json-validation
      - file-hygiene
      - markdown-lint
      - qml-conventions
      - embedded-bash
      - config-cross-ref
      - actionlint
      - wayland-static-lifetime
      - shell-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## Validate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A job_results
          job_results[shell-quality]="${{ needs.shell-quality.result }}"
          job_results[qml-lint]="${{ needs.qml-lint.result }}"
          job_results[cpp-build]="${{ needs.cpp-build.result }}"
          job_results[python-quality]="${{ needs.python-quality.result }}"
          job_results[repo-integrity]="${{ needs.repo-integrity.result }}"
          job_results[json-validation]="${{ needs.json-validation.result }}"
          job_results[file-hygiene]="${{ needs.file-hygiene.result }}"
          job_results[markdown-lint]="${{ needs.markdown-lint.result }}"
          job_results[qml-conventions]="${{ needs.qml-conventions.result }}"
          job_results[embedded-bash]="${{ needs.embedded-bash.result }}"
          job_results[config-cross-ref]="${{ needs.config-cross-ref.result }}"
          job_results[actionlint]="${{ needs.actionlint.result }}"
          job_results[wayland-static-lifetime]="${{ needs.wayland-static-lifetime.result }}"
          job_results[shell-build]="${{ needs.shell-build.result }}"

          all_passed=true
          soft_fail_jobs=""
          for job in "${!job_results[@]}"; do
            result="${job_results[$job]}"
            if [[ "$result" == "success" ]]; then
              echo "- [PASS] **${job}**" >> $GITHUB_STEP_SUMMARY
            elif [[ "$result" == "skipped" ]]; then
              echo "- [SKIP] **${job}**" >> $GITHUB_STEP_SUMMARY
            elif [[ " $soft_fail_jobs " == *" $job "* ]]; then
              echo "- [WARN] **${job}** - pre-existing issues (not blocking)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- [FAIL] **${job}** - ${result}" >> $GITHUB_STEP_SUMMARY
              all_passed=false
            fi
          done

          if [[ "$all_passed" != "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some checks failed. Please review the job logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
