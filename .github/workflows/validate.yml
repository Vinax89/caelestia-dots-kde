name: Validate

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-integration:
    name: Installer integration (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:base
          - distro: fedora
            image: fedora:42
          - distro: debian
            image: debian:bookworm
    steps:
      - name: Bootstrap checkout dependency
        shell: bash
        run: |
          case "${{ matrix.distro }}" in
            arch) pacman -Sy --noconfirm git ;;
            fedora) dnf install -y git ;;
            debian) apt-get update && apt-get install -y --no-install-recommends git ca-certificates ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Exercise real install, retry, cancellation, and rollback
        shell: bash
        env:
          TEST_DISTRO: ${{ matrix.distro }}
        run: bash tests/integration/run-in-container.sh

  cpp-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        submodules: recursive
    - name: Install build dependencies
      run: 'sudo apt-get update -qq

        sudo apt-get install -y -qq cmake g++ make

        '
    - name: Configure installer build
      run: cmake -B installer/build -S installer/tui -DCMAKE_BUILD_TYPE=Release
      env:
        CCACHE_DISABLE: 1
    - name: Build installer
      run: cmake --build installer/build -- -j"$(nproc)"
    - name: Verify binary exists
      run: test -f installer/build/caelestia-install && echo "Installer binary OK"
  shell-build:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
    - name: Bootstrap checkout dependency
      run: pacman -Sy --noconfirm git
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        submodules: recursive
    - name: Install shell build dependencies
      run: "pacman -Syu --noconfirm --needed cmake gcc pkgconf ninja \\\n  meson fftw\
        \ iniparser \\\n  qt6-base qt6-declarative qt6-shadertools qt6-wayland \\\n\
        \  kwindowsystem kguiaddons kglobalaccel kconfig kconfigwidgets \\\n  kcoreaddons\
        \ ki18n kpackage kio kservice networkmanager-qt pulseaudio-qt lm_sensors qt6-tools\
        \ \\\n  wayland libx11 libdrm pipewire \\\n  libqalculate aubio\n"
    - name: Build pinned libcava
      run: 'git clone --filter=blob:none https://github.com/LukashonakV/cava.git /tmp/libcava

        git -C /tmp/libcava checkout --detach f03278ef9e5e7948fb206453d2f02758f8db216c

        meson setup /tmp/libcava/build /tmp/libcava

        meson compile -C /tmp/libcava/build

        meson install -C /tmp/libcava/build

        '
    - name: Configure production plugin
      env:
        CC: /usr/bin/gcc
        CXX: /usr/bin/g++
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
      run: cmake -G Ninja -S shell -B shell/build -DCMAKE_BUILD_TYPE=Release -DENABLE_MODULES=plugin
        -DREQUIRE_CAVA=ON
    - name: Build production plugin
      run: cmake --build shell/build --parallel
  repo-identity:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.x
    - name: Check repository identity consistency
      run: python3 .github/scripts/check_repo_identity.py
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install lint tools
        run: pip install flake8

      - name: Python compile check
        run: |
          echo "::group::Python compile check"
          find . -name '*.py' \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/__pycache__/*' \
            -print0 | xargs -0 -n1 python3 -m py_compile
          echo "::endgroup::"

      - name: flake8 lint
        run: |
          echo "::group::flake8"
          flake8 .github/scripts/ shell/scripts/ \
            --exclude 'menu_perf_stats.py' \
            --max-line-length=120 \
            --extend-ignore=E402,W503,E501,E203 \
            --count \
            --show-source \
            --statistics
          echo "::endgroup::"

  repo-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run repository integrity tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Audit settings search coverage
        run: python3 .github/scripts/audit_search_coverage.py

  json-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Validate theme.json and menu.json
        run: python3 .github/scripts/validate_json_configs.py

  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Run file hygiene checks
        run: python3 .github/scripts/check_file_hygiene.py ${{ github.event_name == 'push' && '--all --report-only' || '' }}

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        continue-on-error: true
        with:
          globs: |
            README.md
            docs/**/*.md
            .github/*.md
            tests/integration/README.md

  qml-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Run QML convention regression check
        run: python3 .github/scripts/check_qml_conventions.py

# error cascades so the reported file is not the cause. qmllint cannot resolve Quickshell's
  qml-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check QML structural syntax
        run: python3 .github/scripts/check_qml_syntax.py --source-root shell

# Bash inside QML `command: ["bash", "-c", `...`]` strings, which qmllint and shellcheck
  embedded-bash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check bash/sh scripts embedded in QML
        run: python3 .github/scripts/check_embedded_bash.py

  config-cross-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Cross-check QML config references against C++ declarations
        run: python3 .github/scripts/check_config_references.py

  # Job 10: actionlint - validate workflow files themselves
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download actionlint
        run: |
          curl -sSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflow files
        run: actionlint -shellcheck= -color -ignore 'missing input "app-id"' -ignore 'input "client-id" is not defined'

  wayland-static-lifetime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check for value-typed statics of Wayland proxy-wrapping types
        run: python3 .github/scripts/check_wayland_static_lifetime.py

# No Qt/QML toolchain here (qmllint6 cannot resolve this repo's qs.* directory imports), so
  qml-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check QML import completeness
        run: python3 .github/scripts/check_qml_imports.py --shell-root shell

  qml-template-interp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check for unescaped bash interpolation in QML template literals
        run: python3 .github/scripts/check_qml_template_interp.py

  # Job 14: Shell quality - syntax, shellcheck, strict mode, unsafe patterns
  shell-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shell quality checks
        run: bash .github/scripts/check_shell_quality.sh

  # Job 15: C++ formatting - the files this change touches, against shell/.clang-format.
  # The plugin has a backlog of files that predate the formatter, so the check is
  # scoped to changed files rather than the whole tree.
  cpp-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Two commits, so a push can diff against its parent.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Install clang-format
        run: pip install clang-format==22.1.8

      - name: Check C++ formatting
        run: python3 .github/scripts/check_cpp_format.py

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run the shell test suite
        run: bash tests/run-tests.sh

  validate-gate:
    needs:
      - installer-integration
      - cpp-build
      - shell-build
      - repo-identity
      - python-quality
      - shell-tests
      - repo-integrity
      - json-validation
      - file-hygiene
      - markdown-lint
      - qml-conventions
      - embedded-bash
      - config-cross-ref
      - actionlint
      - wayland-static-lifetime
      - qml-imports
      - qml-template-interp
      - shell-quality
      - cpp-format
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## Validate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          declare -A job_results
          job_results[installer-integration]="${{ needs.installer-integration.result }}"
          job_results[cpp-build]="${{ needs.cpp-build.result }}"
          job_results[shell-build]="${{ needs.shell-build.result }}"
          job_results[repo-identity]="${{ needs.repo-identity.result }}"
          job_results[python-quality]="${{ needs.python-quality.result }}"
          job_results[repo-integrity]="${{ needs.repo-integrity.result }}"
          job_results[json-validation]="${{ needs.json-validation.result }}"
          job_results[file-hygiene]="${{ needs.file-hygiene.result }}"
          job_results[markdown-lint]="${{ needs.markdown-lint.result }}"
          job_results[qml-conventions]="${{ needs.qml-conventions.result }}"
          job_results[embedded-bash]="${{ needs.embedded-bash.result }}"
          job_results[config-cross-ref]="${{ needs.config-cross-ref.result }}"
          job_results[actionlint]="${{ needs.actionlint.result }}"
          job_results[wayland-static-lifetime]="${{ needs.wayland-static-lifetime.result }}"
          job_results[qml-imports]="${{ needs.qml-imports.result }}"
          job_results[qml-template-interp]="${{ needs.qml-template-interp.result }}"
          job_results[shell-quality]="${{ needs.shell-quality.result }}"
          job_results[shell-tests]="${{ needs.shell-tests.result }}"
          job_results[cpp-format]="${{ needs.cpp-format.result }}"

          all_passed=true
          for job in "${!job_results[@]}"; do
            result="${job_results[$job]}"
            if [[ "$result" == "success" ]]; then
              echo "- [PASS] **${job}**" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" ]]; then
              echo "- [SKIP] **${job}**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- [FAIL] **${job}** - ${result}" >> "$GITHUB_STEP_SUMMARY"
              all_passed=false
            fi
          done

          if [[ "$all_passed" != "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Some checks failed. Please review the job logs above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
